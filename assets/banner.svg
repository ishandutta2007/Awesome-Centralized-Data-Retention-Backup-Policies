<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.12); }
    }
    @keyframes pulseGlowAlt {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.18); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-15px) translateX(8px); opacity: 0.9; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodePulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #38bdf8); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 12px #818cf8); }
    }
    .orb-cyan {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-purple {
      animation: pulseGlowAlt 8s ease-in-out infinite;
      transform-origin: 1000px 300px;
    }
    .stream-line {
      stroke-dasharray: 6 8;
      animation: dashStream 3s linear infinite;
    }
    .pulse-node {
      animation: nodePulse 4s ease-in-out infinite;
      transform-origin: center;
    }
    .particle {
      animation: floatParticle 5s ease-in-out infinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#cyberGrid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb-cyan" cx="220" cy="120" r="160" fill="#0284c7" opacity="0.4" filter="url(#glowCyan)" />
  <circle class="orb-purple" cx="980" cy="280" r="180" fill="#7c3aed" opacity="0.3" filter="url(#glowPurple)" />
  <circle class="orb-cyan" cx="600" cy="380" r="140" fill="#0d9488" opacity="0.25" filter="url(#glowCyan)" />

  <!-- Dynamic Data Flow Vectors in Background -->
  <g opacity="0.45">
    <path class="stream-line" d="M 80 180 Q 280 120, 480 200 T 880 160 T 1120 220" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line" d="M 60 260 Q 300 320, 600 240 T 960 290 T 1140 190" fill="none" stroke="#a855f7" stroke-width="2" style="animation-direction: reverse; animation-duration: 4.5s;" />
  </g>

  <!-- Interactive/Dynamic Floating Nodes (Background Accents) -->
  <circle class="particle" cx="160" cy="90" r="4" fill="#38bdf8" style="animation-delay: 0s;" />
  <circle class="particle" cx="280" cy="340" r="3" fill="#818cf8" style="animation-delay: 1.5s;" />
  <circle class="particle" cx="940" cy="80" r="5" fill="#c084fc" style="animation-delay: 2.2s;" />
  <circle class="particle" cx="1060" cy="330" r="4" fill="#38bdf8" style="animation-delay: 0.8s;" />
  <circle class="particle" cx="720" cy="50" r="3" fill="#2dd4bf" style="animation-delay: 3s;" />

  <!-- FOREGROUND CONTENT: Header Title and Subtitles -->
  <!-- Category Badge -->
  <g transform="translate(600, 52)">
    <rect x="-170" y="0" width="340" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
    <text x="0" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">ENTERPRISE GOVERNANCE &amp; BACKUP ARCHITECTURE</text>
  </g>

  <!-- Main Headline -->
  <text x="600" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#primaryTextGrad)" text-anchor="middle" letter-spacing="-0.5">
    Centralized Data Retention &amp; Backup Policies
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.2">
    Policy-Driven Retention Management • Immutable Backup Governance • Compliance Automation
  </text>

  <!-- Feature Pills / Highlights (Pill Cards) -->
  <g transform="translate(130, 215)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="74" rx="14" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2" />
      <circle cx="36" cy="37" r="16" fill="#0284c7" opacity="0.3" />
      <text x="36" y="43" font-size="16" text-anchor="middle">🛡️</text>
      <text x="68" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Immutable Backups</text>
      <text x="68" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#94a3b8">WORM &amp; Ransomware Lock</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(245, 0)">
      <rect width="210" height="74" rx="14" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2" />
      <circle cx="36" cy="37" r="16" fill="#6366f1" opacity="0.3" />
      <text x="36" y="43" font-size="16" text-anchor="middle">⚖️</text>
      <text x="68" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Regulatory Compliance</text>
      <text x="68" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#94a3b8">GDPR, HIPAA &amp; SOX</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(490, 0)">
      <rect width="210" height="74" rx="14" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2" />
      <circle cx="36" cy="37" r="16" fill="#a855f7" opacity="0.3" />
      <text x="36" y="43" font-size="16" text-anchor="middle">⚙️</text>
      <text x="68" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Policy-as-Code</text>
      <text x="68" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Rego, Sentinel &amp; GitOps</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(735, 0)">
      <rect width="210" height="74" rx="14" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2" />
      <circle cx="36" cy="37" r="16" fill="#14b8a6" opacity="0.3" />
      <text x="36" y="43" font-size="16" text-anchor="middle">🔄</text>
      <text x="68" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">GFS Lifecycle</text>
      <text x="68" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Grandfather-Father-Son</text>
    </g>
  </g>

  <!-- Bottom Interactive Stats Line -->
  <g transform="translate(600, 345)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0.5">
      CURATED ECOSYSTEM FOR CLOUD WORKLOADS • SAAS REPOSITORIES • ON-PREM STORAGE
    </text>
    <!-- Accent line -->
    <line x1="-180" y1="18" x2="180" y2="18" stroke="#334155" stroke-width="1" />
    <circle cx="0" cy="18" r="3" fill="#38bdf8" />
  </g>
</svg>
