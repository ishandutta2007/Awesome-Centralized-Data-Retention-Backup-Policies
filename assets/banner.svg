-shadow(0 0 12px #818cf8)}}.orb-cyan{animation:pulseGlow 6s ease-in-out infinite;transform-origin:200px 100px}.orb-purple{animation:pulseGlowAlt 8s ease-in-out infinite;transform-origin:1000px 300px}.stream-line{stroke-dasharray:6 8;animation:dashStream 3s linear infinite}.particle{animation:floatParticle 5s ease-in-out infinite}</style><rect width="1200" height="420" fill="url(#bgGrad)"/><rect width="1200" height="420" fill="url(#cyberGrid)"/><circle cx="220" cy="120" r="160" fill="#0284c7" class="orb-cyan" filter="url(#glowCyan)" opacity=".4"/><circle cx="980" cy="280" r="180" fill="#7c3aed" class="orb-purple" filter="url(#glowPurple)" opacity=".3"/><circle cx="600" cy="380" r="140" fill="#0d9488" class="orb-cyan" filter="url(#glowCyan)" opacity=".25"/><g opacity=".45"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 80 180 Q 280 120, 480 200 T 880 160 T 1120 220" class="stream-line"/><path fill="none" stroke="#a855f7" stroke-width="2" d="M 60 260 Q 300 320, 600 240 T 960 290 T 1140 190" class="stream-line" style="animation-direction:reverse;animation-duration:4.5s"/></g><circle cx="160" cy="90" r="4" fill="#38bdf8" class="particle" style="animation-delay:0s"/><circle cx="280" cy="340" r="3" fill="#818cf8" class="particle" style="animation-delay:1.5s"/><circle cx="940" cy="80" r="5" fill="#c084fc" class="particle" style="animation-delay:2.2s"/><circle cx="1060" cy="330" r="4" fill="#38bdf8" class="particle" style="animation-delay:.8s"/><circle cx="720" cy="50" r="3" fill="#2dd4bf" class="particle" style="animation-delay:3s"/><g transform="translate(600, 52)"><rect width="340" height="28" x="-170" y="0" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity=".95" rx="14"/><text x="0" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">ENTERPRISE GOVERNANCE &amp; BACKUP ARCHITECTURE</text></g><text x="600" y="125"